# /etc/nginx/sites-available/storage.serey.io
# ALTERNATIVE to Nginx Proxy Manager: plain nginx + certbot config.
# The primary setup uses NPM (see SETUP.md section 7); use this file only
# if running nginx directly on the host instead.

server {
    listen 443 ssl;
    http2 on;
    server_name storage.serey.io;

    ssl_certificate     /etc/letsencrypt/live/storage.serey.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.serey.io/privkey.pem;

    access_log /var/log/nginx/storage.serey.io.access.log;
    error_log  /var/log/nginx/storage.serey.io.error.log;

    # ---- tus resumable uploads -> node ----
    location /files {
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 0;          # chunk PATCH bodies can be huge
        proxy_request_buffering off;     # stream chunks straight through
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- API routes (status/delete/health) -> node ----
    # Regex locations win over the /videos/ prefix below. API paths have no
    # file extension; published files always do.
    location ~ ^/videos/[0-9A-HJKMNP-TV-Z]{26}(/status)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/audio/[0-9A-HJKMNP-TV-Z]{26}(/status)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/images/[0-9A-HJKMNP-TV-Z]{26}(/status)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- published videos + thumbnails straight from disk ----
    # nginx handles HTTP Range (seek) natively for static files.
    location /videos/ {
        root /var/www/serey-videos;      # serves /var/www/serey-videos/videos/...
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    location /thumbnails/ {
        root /var/www/serey-videos;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    location /audio/ {
        root /var/www/serey-videos;      # serves /var/www/serey-videos/audio/...
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    location /images/ {
        root /var/www/serey-videos;      # serves /var/www/serey-videos/images/...
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ---- paywalled media ----
    # The app authorizes the signature, then hands off with X-Accel-Redirect so
    # nginx still streams from disk (Range/seek, sendfile) without the bytes
    # passing through Node.
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video responses must stream, not accumulate in a buffer.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Reachable ONLY via X-Accel-Redirect from the app above; nginx refuses a
    # direct request to it. This is what keeps /private off the public web.
    location /internal-media/ {
        internal;
        alias /var/www/serey-videos/private/;
        # Per-viewer, expiring URLs: never let Cloudflare or any shared proxy
        # keep a copy. The app sets this too; repeated here so a future change
        # to either side alone cannot silently make premium media cacheable.
        add_header Cache-Control "private, no-store" always;
    }

    # Belt and braces: even if a future edit adds a public root that happens to
    # cover it, /private must never be served directly.
    location /private/ {
        deny all;
        return 404;
    }

    # The scan gate's staging dir. Serving it would defeat the entire gate.
    location /pending/ {
        deny all;
        return 404;
    }

    # ULID -> CID resolver. An S5-published file has no local copy to serve.
    location /cdn/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S5's blob store, read back out of s3d. The node's cdnUrls points here and
    # every read fails without it. Public and uncacheable-by-mistake-proof:
    # blobs are named by their own hash.
    location /blob/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Operator-only. The app needs the master key; keep it off the public
    # internet too.
    location /moderation/ {
        # allow <your ops IP>;  deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# cdn.serey.io — public media hostname, mapped to the resolver so stored URLs
# stay clean and never contain a CID. Keep grey-clouded if video volume grows:
# Cloudflare's ToS restricts video playback through their CDN.
