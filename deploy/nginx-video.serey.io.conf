# /etc/nginx/sites-available/video.serey.io
# Dedicated video storage host. Cloudflare DNS record for video.serey.io
# must be DNS-only (grey cloud) — the CF proxy caps bodies at 100MB and
# their ToS forbids serving video through the CDN on the Pro plan.

server {
    listen 443 ssl;
    http2 on;
    server_name video.serey.io;

    ssl_certificate     /etc/letsencrypt/live/video.serey.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.serey.io/privkey.pem;

    access_log /var/log/nginx/video.serey.io.access.log;
    error_log  /var/log/nginx/video.serey.io.error.log;

    # ---- tus resumable uploads -> node ----
    location /files {
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 0;          # chunk PATCH bodies can be huge
        proxy_request_buffering off;     # stream chunks straight through
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- API routes (status/delete/health) -> node ----
    # Regex locations win over the /videos/ prefix below. API paths have no
    # file extension; published files always do.
    location ~ ^/videos/[0-9A-HJKMNP-TV-Z]{26}(/status)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- published videos + thumbnails straight from disk ----
    # nginx handles HTTP Range (seek) natively for static files.
    location /videos/ {
        root /var/www/serey-videos;      # serves /var/www/serey-videos/videos/...
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    location /thumbnails/ {
        root /var/www/serey-videos;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}

server {
    listen 80;
    server_name video.serey.io;
    return 301 https://$host$request_uri;
}
