# Public media storage: S5 for content addressing, s3d for the bytes.
#
#   storage API -> S5 node -> [store.s3] -> s3d -> Sia network
#
# S5 holds nothing itself; [store] in its config.toml decides where bytes land.
# Both containers share a network, so S5 reaches s3d at http://s3d:8000 and
# neither port needs publishing publicly.
#
# State lives under /var/lib, outside the checkout. BACK BOTH UP:
#   /var/lib/s5/config/config.toml   an unrecoverable keypair seed
#   /var/lib/s3d/s3d.yml             the 12-word recovery phrase
#
# See README.md in this directory before changing anything.

services:
  s5:
    image: ghcr.io/s5-dev/node:latest
    container_name: s5-node
    restart: unless-stopped
    depends_on:
      - s3d
    # NPM is containerised and cannot reach the host's 127.0.0.1. 172.18.0.1 is
    # the bridge gateway; check yours with `docker network inspect`.
    ports:
      - "172.18.0.1:5050:5050"
    volumes:
      - /var/lib/s5/config:/config
      - /var/lib/s5/db:/db
      - /var/lib/s5/cache:/cache
      # Local filesystem store only. Mounted so switching [store] back for a
      # test needs no compose change.
      - /var/lib/s5/data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  s3d:
    image: ghcr.io/siafoundation/s3d:master
    container_name: s3d
    restart: unless-stopped
    # Loopback only -- for bucket management from the host, since s3d has no
    # bucket CLI. Other commands: `docker compose run --rm s3d <command>`.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/lib/s3d:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
