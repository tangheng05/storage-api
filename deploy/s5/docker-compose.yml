# Public media storage: S5 for content addressing, s3d for the bytes.
#
#   storage API -> S5 node -> [store.s3] -> s3d -> Sia network
#
# S5 gives CIDs, verified streaming and lookup. It holds nothing itself: where
# the bytes land is [store] in its config.toml. Pointing that at s3d puts them
# on Sia, erasure-coded across independent hosts and encrypted client-side, so
# no host and no gateway ever sees plaintext.
#
# Both containers share a network, so S5 reaches s3d at http://s3d:8000 and
# neither port needs publishing. The S5 API is published on the docker bridge
# only, because Nginx Proxy Manager runs in its own container and cannot reach
# 127.0.0.1 on the host.
#
# State lives under /var/lib, deliberately outside the checkout:
#   /var/lib/s5/config/config.toml   an unrecoverable keypair seed
#   /var/lib/s3d/s3d.yml             the 12-word recovery phrase
# BACK BOTH UP. Losing the s3d phrase loses access to everything on Sia.

services:
  s5:
    image: ghcr.io/s5-dev/node:latest
    container_name: s5-node
    restart: unless-stopped
    depends_on:
      - s3d
    # NPM is containerised, so it cannot reach 127.0.0.1 on the host. 172.18.0.1
    # is the bridge gateway; check yours with `docker network inspect`.
    ports:
      - "172.18.0.1:5050:5050"
    volumes:
      - /var/lib/s5/config:/config
      - /var/lib/s5/db:/db
      - /var/lib/s5/cache:/cache
      # Only used by the local filesystem store. Keep it mounted so switching
      # [store] back for a test needs no compose change.
      - /var/lib/s5/data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  s3d:
    image: ghcr.io/siafoundation/s3d:master
    container_name: s3d
    restart: unless-stopped
    # Not published: only S5 talks to it, over the compose network. Run the CLI
    # with `docker compose run --rm s3d <command>`.
    expose:
      - "8000"
    volumes:
      - /var/lib/s3d:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
