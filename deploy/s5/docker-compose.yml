# S5 node — content-addressed storage for PUBLIC media.
#
# Runs on the same VPS as the storage API. Two hostnames matter and they are not
# the same one:
#
#   S5_NODE_URL          how the storage API uploads   -> http://127.0.0.1:5050
#   S5_DOWNLOAD_BASE_URL where the BROWSER fetches     -> https://s5.serey.io
#
# /cdn 302-redirects the browser at the download host, so it has to be publicly
# reachable. Point s5.serey.io at 127.0.0.1:5050 with another NPM proxy host.
#
# State lives under /var/lib/s5, deliberately outside the checkout: /config
# holds a keypair seed that cannot be regenerated, and a redeploy into a fresh
# directory would strand it.
#
# Where the bytes land is [store] in config.toml, and it is the decision that
# decides whether any of this buys durability. See config.example.toml.

services:
  s5:
    image: ghcr.io/s5-dev/node:latest
    container_name: s5-node
    restart: unless-stopped
    # Localhost only. Everything public goes through the reverse proxy.
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      # config.toml is generated here on first boot; edit it, then restart.
      - /var/lib/s5/config:/config
      # Node state. Put this on SSD.
      - /var/lib/s5/db:/db
      # Upload/download staging.
      - /var/lib/s5/cache:/cache
      # Only used by the local filesystem store. Harmless otherwise, and it
      # means switching [store] to local needs no compose change.
      - /var/lib/s5/data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
