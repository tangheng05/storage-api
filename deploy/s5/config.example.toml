# Reference for the sections that matter in the S5 node's config.toml.
#
# The real file is generated at /var/lib/s5/config/config.toml on first boot —
# edit that one and `docker compose restart s5`. Do not paste this over it
# wholesale; the generated file has a [keypair] seed you must keep.

[http.api]
# MUST match the hostname the reverse proxy actually serves. The node builds
# download URLs from this, so a mismatch produces broken links that look like a
# caching problem. This is the classic mistake.
domain = "s5.serey.io"
port = 5050

[keypair]
# Generated on first boot. Signs this node's network messages. Back it up and
# never regenerate it casually.
# seed = "..."

# Leave accounts OFF. Enabling them stops the admin key working on the download
# route (401), and the account-token flow that replaces it is challenge/response
# that the docs never actually specify a request body for.
#
# It does not matter for us: the storage API proxies public media through /cdn
# with the admin key server-side, so the node needs no anonymous access and no
# public hostname at all. Downloads by CID require auth either way.
#
# [accounts]
# enabled = true

[database]
path = "/db"

[cache]
path = "/cache"

# --- Storage backend --------------------------------------------------------
#
# THE ONE DECISION THAT MATTERS. Get this wrong and the node keeps every blob on
# this VPS's disk, which means two copies on one volume and zero protection
# against the disk failure the second copy exists to survive.
#
# Use S3, pointed at your sia.storage account's s3d gateway. That is the same
# access key / secret you get from the sia.storage dashboard under My Apps, and
# it keeps Sia contracts and the wallet out of our hands entirely.

[store.s3]
accessKey = "<from the sia.storage dashboard>"
secretKey = "<from the sia.storage dashboard>"
bucket = "<your bucket>"
endpointUrl = "<the s3d gateway URL, include https://>"

# Do NOT use [store.sia]. It talks to renterd directly, the S5 docs call both
# renterd and that integration experimental, and the Sia Foundation has since
# stopped recommending renterd at all. Doubly stale.
#
# The local filesystem store is fine for proving the pipeline and useless for
# durability — it writes a second copy of every public file to this same disk.
# Use it to validate the upload path, not as the end state:
#
#   [store.local]
#   path = "/data"
#
# On a 37 GB volume that also holds the originals, do not leave it there.
